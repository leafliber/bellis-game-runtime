# 《魔法少女的魔女审判》适配包。
# 格式见 docs/modules/game-adapter.md 的“格式”，本游戏特有的适配见 docs/games/witch-trial.md。
# G1 只标定了只读感知要用的对白框（名字栏、对白文字与继续标记），依据见 docs/games/witch-trial.md
# 的“适配包”；其余 ROI 与签名留到 G2 的快路径需要时，在本机截图与录制上按 C-5 标定。
# 这里不写任何猜测的坐标；锚点模板只在本地数据目录里。

id = "witch-trial"
name = "魔法少女的魔女审判"
version = "0.1.0"

[window]
process_name = "manosaba.exe"
window_class = "UnityWndClass"
title = "manosaba"

[resolution]
width = 2560
height = 1440

[language]
tag = "zh-Hans"
# 只做通用的文字系统一层；简繁之分要靠固定文字时再补。
fixed_texts = []

[compliance]
basis = "docs/compliance.md 的《魔法少女的魔女审判》，合规确认 C-1、C-2、C-4"
text_source = "screen"
training = false
demonstrations = false
recording_quota_gb = 50
models = [
    # 已确认启用安全沙箱的接入点；各用途的型号经 GS-07 对照后再加。
    { vendor = "volcengine-ark", model = "glm-5-3-flash-260828" },
]

[whitelist]
# 只允许左键点击；快进、自动、回想与存读档不进白名单，可用的按键由 GS-05 普查后再加。
click_buttons = ["left"]
press_keys = []
scroll = false
click_regions = ["client"]
# 暂定值，GS-05 核对。
press_duration = 0.05
max_rate = 2
# 不允许长按。
hold_keys = []
hold_buttons = []

# 画面类型映射见 docs/games/witch-trial.md 的“运行要求”。

[[screens]]
id = "dialogue"
title = "对白"
type = "对话"

[[screens]]
id = "choice"
title = "选项"
type = "选择"

[[screens]]
id = "trial"
title = "审判"
type = "计时选择"

[[screens]]
id = "settings"
title = "设置"
type = "设置"

[[screens]]
id = "save-load"
title = "存读档"
type = "存读档"

[[screens]]
id = "bad-ending"
title = "坏结局"
type = "坏结局"

[risk]
# 暂为空，随 GS-05 补充；通用禁用词表仍生效。

[rois]
client = { title = "整个客户区", rect = [0.0, 0.0, 1.0, 1.0] }
# 2560×1440 的客户区上：名字栏 x 380–960、y 920–1145（含放大的首字与菱形底，不含其下的横线）；
# 对白文字 x 540–2040、y 1150–1395（至多三行，右边不到继续标记）。
speaker = { title = "名字栏", rect = [0.1484375, 0.6388889, 0.375, 0.7951389] }
dialogue = { title = "对白框", rect = [0.2109375, 0.7986111, 0.796875, 0.96875] }
# 锚点的搜索范围：右下角的继续标记 x 2040–2190、y 1260–1400；底边中段的黑色荆棘 x 1220–1730、
# y 1360–1440，它是界面的一部分，不随场景与鼠标悬停变化，读取画面（全黑）上没有。
continue-marker = { title = "继续标记", rect = [0.796875, 0.875, 0.8554688, 0.9722222] }
hud-border = { title = "底边荆棘", rect = [0.4765625, 0.9444444, 0.6757813, 1.0] }
# 以下尚未标定，G2 的快路径需要时再标。
choices = { title = "选项" }
trial-statement = { title = "审判发言区" }

[[signatures]]
# 尚未标定。右上角的齿轮最好认，但鼠标悬停时会放大，模板就认不出；对白框因此不写 screen，
# 按通用缺省读（docs/games/witch-trial.md 的“适配包”）。G2 需要对白画面的签名时再定。
id = "dialogue"
screen = "dialogue"

[[signatures]]
# 继续标记：开始逐字显示即消失，显示完后淡入并明暗闪烁，最暗时约 0.3 秒认不出（那时剧情记录按
# 文字不变判完整）。先看标记，再看底边荆棘以认出游戏界面。模板只在本地数据目录里，
# 从 2026-11-01 的录制裁出：标记 90×88（x 2070、y 1290 起），荆棘 450×50（x 1250、y 1385 起）。
id = "dialogue-continue"
screen = "dialogue"
anchors = [
    { roi = "continue-marker", template_sha256 = "239c83b09eacfe7e8c12525d786c3b7e79b8770ff18a02089aafd709b61a5c62", min_score = 0.6 },
    { roi = "hud-border", template_sha256 = "db0d287b4f36a56c6830a6e23aaa0b0a53e1f9f23d388ec257185215397dfbe4", min_score = 0.8 },
]

# 以下签名尚未标定，G2 的快路径需要时再标。

[[signatures]]
id = "choice"
screen = "choice"

[[signatures]]
id = "trial"
screen = "trial"

[[signatures]]
id = "bad-ending"
screen = "bad-ending"

# 剧情记录读文字的地方（docs/modules/game-adapter.md 的“对白框”）。不写 screen：在每个不是过场的
# 帧上读，对白文字为空即不在对白。
[[dialogue_boxes]]
speaker = "speaker"
text = "dialogue"
continue_signature = "dialogue-continue"

[[notes]]
id = "characters"
title = "角色表"

[[notes]]
id = "evidence"
title = "证据与证词本"

[[notes]]
id = "open-questions"
title = "尚未解决的疑点与矛盾"
