# 合成游戏的适配包，声明格式的第一个样例。
# 格式见 docs/modules/game-adapter.md 的“格式”，合成游戏见 docs/modules/offline-tools.md 的“合成游戏”。

id = "synthetic-game"
name = "合成游戏"
version = "0.1.0"

[window]
# 窗口外壳：拥有窗口的进程是 uv 管理的 python.exe；Win32 窗口类由 Tk 固定为 TkTopLevel，
# 所有 Tk 程序都相同，须与标题一起用。
process_name = "python.exe"
window_class = "TkTopLevel"
title = "Bellis Synthetic Game"

[resolution]
# GameConfig 的缺省分辨率。
width = 1280
height = 720

[language]
tag = "zh-Hans"

# 语言核对的固定文字一层（可选）：标题菜单三个按钮的文字（story.py 的 Ui）。文字系统一层按剧情记录
# 的句子自动进行，不用写。
[[language.fixed_texts]]
screen = "title-menu"
roi = "menu-start"
text = "开始"

[[language.fixed_texts]]
screen = "title-menu"
roi = "menu-shop"
text = "商店"

[[language.fixed_texts]]
screen = "title-menu"
roi = "menu-help"
text = "说明"

[compliance]
basis = "合成游戏是本仓库的测试夹具，不受任何游戏条款约束（GR-30）"
text_source = "screen"
training = true
demonstrations = true
recording_quota_gb = 10
models = [
    { vendor = "volcengine-ark", model = "glm-5-3-flash-260828" },
]

[whitelist]
# 合成游戏只响应左键点击、滚动与下列按键（docs/modules/offline-tools.md 的“输入与真值”）。
click_buttons = ["left"]
# 回车、空格、Esc、上、下；上下是扩展键。
press_keys = [0x1C, 0x39, 0x01, 0xE048, 0xE050]
scroll = true
click_regions = ["client"]
press_duration = 0.05
max_rate = 10
hold_keys = []
hold_buttons = []

# 画面类型映射即 docs/modules/offline-tools.md “画面与转换”表的第二列；弹窗是叠加层，不是画面；
# 播片也不声明为画面，由 scene@1 按持续整屏的动态识别。

[[screens]]
id = "title-menu"
title = "标题菜单"
type = "菜单"

[[screens]]
id = "dialogue"
title = "对话"
type = "对话"

[[screens]]
id = "choice"
title = "选项"
type = "选择"

[[screens]]
id = "timed-choice"
title = "计时选择"
type = "计时选择"

[[screens]]
id = "shop"
title = "商店"
type = "商店"

[[screens]]
id = "bad-ending"
title = "坏结局"
type = "坏结局"

[risk]

[risk.returns.shop]
roi = "shop-leave"
text = "离开"

[decisions.choice]
options = "choices"
prompt = "choice-prompt"

[decisions.timed-choice]
options = "choices"
prompt = "choice-prompt"
timer = { roi = "timer-text", prefix = "剩余", suffix = "秒" }

[restarts.bad-ending]
roi = "ending-retry"
text = "重来"
success_signature = "dialogue"

# ROI 是 tools/synthetic-game/src/synthetic_game/layout.py 在设计稿 1280×720 下的矩形除以 1280×720，
# 由 runtime/tests/adapter/test_packages.py 核对。
[rois]
client = { title = "整个客户区", rect = [0.0, 0.0, 1.0, 1.0] }
clock-tower = { title = "对话背景的钟楼", rect = [0.4375, 0.083333, 0.5625, 0.583333] }
speaker = { title = "名字栏", rect = [0.046875, 0.590278, 0.21875, 0.659722] }
dialogue = { title = "对白文字", rect = [0.0625, 0.694444, 0.9375, 0.930556] }
continue-marker = { title = "继续标记", rect = [0.9296875, 0.902778, 0.9484375, 0.933333] }
choice-prompt = { title = "选项提问", rect = [0.109375, 0.097222, 0.890625, 0.236111] }
choices = { title = "选项按钮", rect = [0.28125, 0.319444, 0.71875, 0.686111] }
timer-bar = { title = "计时条", rect = [0.1875, 0.819444, 0.8125, 0.852778] }
timer-text = { title = "剩余时间", rect = [0.359375, 0.873611, 0.640625, 0.930556] }
menu-start = { title = "菜单的“开始”", rect = [0.359375, 0.416667, 0.640625, 0.505556] }
menu-shop = { title = "菜单的“商店”", rect = [0.359375, 0.538889, 0.640625, 0.627778] }
menu-help = { title = "菜单的“说明”", rect = [0.359375, 0.661111, 0.640625, 0.75] }
shop-list = { title = "商店列表", rect = [0.0625, 0.180556, 0.921875, 0.819444] }
shop-leave = { title = "商店的“离开”", rect = [0.78125, 0.854167, 0.9375, 0.951389] }
popup-text = { title = "弹窗文字", rect = [0.296875, 0.347222, 0.703125, 0.541667] }
popup-ok = { title = "弹窗的“确定”", rect = [0.421875, 0.569444, 0.578125, 0.652778] }
ending-text = { title = "坏结局文字", rect = [0.15625, 0.402778, 0.84375, 0.597222] }
ending-retry = { title = "坏结局的“重来”", rect = [0.421875, 0.666667, 0.578125, 0.763889] }

# 画面签名。颜色取自 tools/synthetic-game/src/synthetic_game/render.py，点取在各画面固定不变的区域里
# （设计稿 1280×720 的坐标除以 1280×720）；判别规则见 docs/modules/perception.md 的“画面签名的判别”。
# 弹窗不是画面：弹窗压暗了整个画面，显示时不命中任何签名。

[[signatures]]
id = "title-menu"
screen = "title-menu"
pixels = [
    { at = [0.03125, 0.055556], color = "#1A2440", tolerance = 6 }, # 左上角的底色
    { at = [0.96875, 0.944444], color = "#1A2440", tolerance = 6 }, # 右下角的底色
]
texts = [{ roi = "menu-start", text = "开始" }]

[[signatures]]
# 对话的底色随剧情节点变化，改看钟楼：钟面的中心、钟楼的下部与对白框的左侧。
id = "dialogue"
screen = "dialogue"
pixels = [
    { at = [0.5, 0.208333], color = "#F5F5F0", tolerance = 6 },
    { at = [0.453125, 0.416667], color = "#181A26", tolerance = 6 },
    { at = [0.046875, 0.833333], color = "#181A26", tolerance = 6 },
]
# 钟面模板由 synthetic_game.anchors 从渲染裁出，不进版本库。
anchors = [
    { roi = "clock-tower", template_sha256 = "4d02eb5968a54d373230cdfe53774c5c56c82430866f6dcc7c4d53d1918f8b69", min_score = 0.9 },
]

[[signatures]]
# 继续标记：对话签名的三处像素检查加上继续标记三角形里的一点（一句显示完时才画出）。与对话同级、
# 指向对话，所以它不改变画面的结果；剧情记录按它是否命中判断继续标记是否可见。
id = "dialogue-continue"
screen = "dialogue"
pixels = [
    { at = [0.5, 0.208333], color = "#F5F5F0", tolerance = 6 },
    { at = [0.453125, 0.416667], color = "#181A26", tolerance = 6 },
    { at = [0.046875, 0.833333], color = "#181A26", tolerance = 6 },
    { at = [0.9390625, 0.9125], color = "#F5F5F0", tolerance = 6 },
]

[[signatures]]
id = "choice"
screen = "choice"
pixels = [
    { at = [0.03125, 0.055556], color = "#222838", tolerance = 6 }, # 底色
    { at = [0.1171875, 0.111111], color = "#181A26", tolerance = 6 }, # 提问面板的左上部
]

[[signatures]]
# 计时选择是选项加上计时条：比选项多一处计时条上的点，叠加优先级更高。计时条已走与未走的部分
# （#DC5A3C 与 #464650）都在容差内，选项画面上这里的底色不在。
id = "timed-choice"
screen = "timed-choice"
priority = 1
pixels = [
    { at = [0.03125, 0.055556], color = "#222838", tolerance = 6 },
    { at = [0.1171875, 0.111111], color = "#181A26", tolerance = 6 },
    { at = [0.5, 0.836111], color = "#915046", tolerance = 75 },
]

[[signatures]]
id = "shop"
screen = "shop"
pixels = [
    { at = [0.03125, 0.055556], color = "#283830", tolerance = 6 },
    { at = [0.03125, 0.972222], color = "#283830", tolerance = 6 },
]

[[signatures]]
id = "bad-ending"
screen = "bad-ending"
pixels = [
    { at = [0.03125, 0.055556], color = "#480E12", tolerance = 6 },
    { at = [0.96875, 0.944444], color = "#480E12", tolerance = 6 },
]
texts = [{ roi = "ending-retry", text = "重来" }]

# 剧情记录读文字的地方：docs/modules/game-adapter.md 的“对白框”。
[[dialogue_boxes]]
screen = "dialogue"
speaker = "speaker"
text = "dialogue"
continue_signature = "dialogue-continue"

# 阅读节奏是可选的覆盖（docs/modules/game-adapter.md 的“阅读节奏”），这里作为格式的样例写全。
[pacing]
min_action_interval = 0.2
read_base = 0.5
read_per_char = 0.02
voice_unknown_wait = 2.0
voice_busy_wait = 8.0

[[notes]]
id = "characters"
title = "人物"

[[notes]]
id = "clues"
title = "线索"
