[package]
name = "realtime-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
audio-capture = { path = "../audio-capture" }
audio-ring = { path = "../audio-ring" }
bellis-channel = { path = "../bellis-channel" }
capture = { path = "../capture" }
core-protocol = { path = "../core-protocol" }
frame-ring = { path = "../frame-ring" }
game-bridge-protocol = { path = "../game-bridge-protocol" }
mono-clock = { path = "../mono-clock" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
getrandom.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }

[lints]
workspace = true
