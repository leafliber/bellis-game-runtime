[project]
name = "bellis-game-runtime"
version = "0.0.0"
description = "Bellis Game Runtime 的主进程与插件"
requires-python = "==3.12.*"
dependencies = [
    "core-protocol",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.14.2",
]

[project.scripts]
check-adapters = "game_runtime.adapter.check:main"
observe = "game_runtime.observe.cli:main"
operate = "game_runtime.operator.cli:main"
record = "game_runtime.recording.cli:record_main"
recording = "game_runtime.recording.cli:recording_main"
replay = "game_runtime.recording.cli:replay_main"
supervise = "game_runtime.step_control.cli:main"
task-ledger = "game_runtime.game_bridge.ledger_cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "game_runtime"

[tool.uv.sources]
core-protocol = { workspace = true }
